# =============================================================================
# sing-box all-in-one 单容器编排
#   一个容器内经 supervisor 守护: sing-box(vmess/trojan) + conduitvpn
#   + cloudflared + nginx(coraza WAF)
#   构建: docker compose build   启动: docker compose up -d
# =============================================================================
services:
  singbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: iflyelf/singbox-all:latest
    container_name: singbox
    hostname: singbox
    tty: true
    stdin_open: true
    restart: always
    # 住宅IP出口需要创建 TUN 设备 + 修改路由, 需特权
    privileged: true
    cap_add:
      - ALL
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    env_file:
      - .env
    volumes:
      # conduitvpn 持久化 (VPNGate 节点 / 状态 / 生成的链接订阅)
      - ./data:/data/conduitvpn:rw
      # nginx 日志
      - ./logs/nginx:/data/nginx/logs:delegated
      # 同步宿主机时区
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      # cloudflared quick tunnel 回源 / 也可直连 (HTTP, 无 SSL)
      - "80:80"
      # conduitvpn 管理台: 仅暴露宿主机回环, 不对公网开放
      - "127.0.0.1:8787:8787"
    healthcheck:
      # 探测 conduitvpn 健康端点, 失败由 supervisor autorestart + restart:always 兜底
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
