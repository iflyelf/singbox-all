# =============================================================================
# singbox-all 单容器编排 (host 网络模式)
#   一个容器内经 supervisor 守护: sing-box(vmess/trojan) + conduitvpn
#   + cloudflared + nginx(coraza WAF)
#   直接使用已构建镜像 iflyelf/singbox-all:latest
#   启动: docker compose up -d   更新: docker compose pull && docker compose up -d
# =============================================================================
services:
  singbox:
    image: iflyelf/singbox-all:latest
    container_name: singbox
    hostname: singbox
    tty: true
    stdin_open: true
    restart: always
    # host 网络模式: 容器直接使用宿主机网络栈, 无需 iptables NAT / 端口映射
    #   nginx:80 / conduitvpn:8787 / 7928 直接监听宿主机对应端口
    network_mode: host
    # root 运行 + 特权 (住宅IP出口需创建 TUN 设备 + 修改路由)
    user: root
    privileged: true
    cap_add:
      - ALL
    devices:
      - /dev/net/tun
    env_file:
      - .env
    volumes:
      # conduitvpn 持久化 (VPNGate 节点 / 状态 / 生成的链接订阅)
      - ./data:/data/conduitvpn:rw
      # nginx 日志
      - ./logs/nginx:/data/nginx/logs:delegated
      # 同步宿主机时区
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      # 探测 conduitvpn 健康端点, 失败由 supervisor autorestart + restart:always 兜底
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
