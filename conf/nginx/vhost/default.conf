# =============================================================================
# vmess / trojan WebSocket 反向代理 (all-in-one 单容器, 走 127.0.0.1)
# =============================================================================

# 上游: 同容器内 sing-box 监听端口
upstream vmess  { server 127.0.0.1:6601 max_fails=0 fail_timeout=0; }
upstream trojan { server 127.0.0.1:6602 max_fails=0 fail_timeout=0; }

# 按 WS path 前缀分流 (path 已含 /xiaonuo 前缀, 与 sing-box 服务端对齐, 不 strip)
server {
    listen 80;
    listen [::]:80;
    server_name _;
    charset utf-8;

    include cache.conf;

    root /www;
    index index.html index.htm;

    access_log logs/default.log combined;
    error_log  logs/default.log error;

    # vmess WebSocket
    location = /xiaonuo/vmess {
        include websocket.conf;
        proxy_pass http://vmess;
        access_log logs/xiaonuo.log combined;
        error_log  logs/xiaonuo.log error;
    }

    # trojan WebSocket
    location = /xiaonuo/trojan {
        include websocket.conf;
        proxy_pass http://trojan;
        access_log logs/xiaonuo.log combined;
        error_log  logs/xiaonuo.log error;
    }

    # 隐藏敏感文件
    location ~ /\. { deny all; }
}
