[program:conduitvpn]
; docker host 网络模式 -> conduitvpn 必须用 NETWORK_MODE=host (socket 标记路由, 从不改宿主机默认路由)
; UI_HOST=0.0.0.0 便于外部访问管理台; LOCAL_PROXY_HOST=127.0.0.1 仅供 sing-box 本机出站
; ⚠️ 管理台将监听宿主机所有网卡, 请确保 UI_PASSWORD 强密码, 或用防火墙限制 8787 端口来源
environment=HOME="/root",USER="root",LC_ALL="C.UTF-8",LANG="C.UTF-8",NETWORK_MODE="host",UI_HOST="0.0.0.0",LOCAL_PROXY_HOST="127.0.0.1",HY2_PORT="0"
process_name=conduitvpn
priority=1                       ;最先启动: 住宅IP出口, 其余进程依赖它
command=/usr/bin/conduitvpn --data-dir /data/conduitvpn
directory=/data/conduitvpn
numprocs=1
stopsignal=INT
autostart=true
autorestart=true
killasgroup=true
stopasgroup=true
startsecs=5
startretries=10000
redirect_stderr=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stdout
stdout_logfile_maxbytes=0
