[program:conduitvpn]
; docker host 网络模式 -> conduitvpn 必须用 NETWORK_MODE=host (socket 标记路由, 从不改宿主机默认路由)
; UI 与本地代理仅监听回环, 避免管理台/代理端口暴露到宿主机公网
environment=HOME="/root",USER="root",LC_ALL="C.UTF-8",LANG="C.UTF-8",NETWORK_MODE="host",UI_HOST="127.0.0.1",LOCAL_PROXY_HOST="127.0.0.1",HY2_PORT="0"
process_name=conduitvpn
priority=1                       ;最先启动: 住宅IP出口, 其余进程依赖它
command=/usr/bin/conduitvpn --data-dir /data/conduitvpn
directory=/data/conduitvpn
numprocs=1
stopsignal=INT
autostart=true
autorestart=true
killasgroup=true
stopasgroup=true
startsecs=5
startretries=10000
redirect_stderr=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stdout
stdout_logfile_maxbytes=0
