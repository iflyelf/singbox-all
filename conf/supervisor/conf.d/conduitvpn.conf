[program:conduitvpn]
; NETWORK_MODE / UI_HOST / LOCAL_PROXY_HOST / HY2_PORT 等应用变量均由 .env 提供,
; 经 compose env_file 注入容器, supervisord 自动透传给本进程 (此处不再硬编码, 便于配置)。
environment=HOME="/root",USER="root",LC_ALL="C.UTF-8",LANG="C.UTF-8"
process_name=conduitvpn
priority=1                       ;最先启动: 住宅IP出口, 其余进程依赖它
command=/usr/bin/conduitvpn --data-dir /data/conduitvpn
directory=/data/conduitvpn
numprocs=1
stopsignal=INT
autostart=true
autorestart=true
killasgroup=true
stopasgroup=true
startsecs=5
startretries=10000
redirect_stderr=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stdout
stdout_logfile_maxbytes=0
