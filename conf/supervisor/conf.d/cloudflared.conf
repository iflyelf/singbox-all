[program:cloudflared]
environment=HOME="/root",USER="root",LC_ALL="C.UTF-8",LANG="C.UTF-8",TUNNEL_METRICS="127.0.0.1:60123",NO_AUTOUPDATE="true"
process_name=cloudflared
priority=4                       ;nginx 之后启动 (回源 nginx:80)
; 双模式: 有 TUNNEL_TOKEN 走命名隧道(固定域名); 否则走 quick tunnel(随机域名)
command=/usr/bin/cloudflared-run.sh
directory=/tmp
numprocs=1
stopsignal=INT
autostart=true
autorestart=true
killasgroup=true
stopasgroup=true
startsecs=5
startretries=10000
redirect_stderr=true
stdout_logfile=/tmp/cloudflared.log
stderr_logfile=/tmp/cloudflared.log
stdout_logfile_maxbytes=0
