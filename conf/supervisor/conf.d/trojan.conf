[program:trojan]
environment=HOME="/root",USER="root",LC_ALL="C.UTF-8",LANG="C.UTF-8"
process_name=trojan
priority=2                       ;conduitvpn 之后启动
command=/usr/bin/sing-box run -c /etc/sing-box/trojan.json
directory=/usr/bin/
numprocs=1
stopsignal=KILL
autostart=true
autorestart=true
killasgroup=true
stopasgroup=true
startsecs=5
startretries=10000
exitcodes=0,2
redirect_stderr=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stdout
stdout_logfile_maxbytes=0
