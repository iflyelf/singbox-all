[program:nginx]
environment=HOME="/root",USER="root",LC_ALL="C.UTF-8",LANG="C.UTF-8"
process_name=nginx
priority=3                       ;sing-box 之后启动 (反代其 WS 端口)
command=/usr/sbin/nginx -g "daemon off;"
directory=/data/nginx
numprocs=1
stopsignal=QUIT
autostart=true
autorestart=true
killasgroup=true
stopasgroup=true
startsecs=5
startretries=10000
redirect_stderr=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stdout
stdout_logfile_maxbytes=0
