[program:genlinks]
; OUT_DIR 指向已挂载的持久化目录, 生成的 links.txt / sub.txt 宿主机 ./data 下可直接查看
environment=HOME="/root",USER="root",LC_ALL="C.UTF-8",LANG="C.UTF-8",OUT_DIR="/data/conduitvpn"
process_name=genlinks
priority=5                       ;最后运行: 等 cloudflared 拿到域名后生成链接
; 单次任务: 轮询等待隧道域名就绪 -> 生成链接/订阅 -> 退出
command=/usr/bin/gen-links.sh --wait
directory=/data/conduitvpn
numprocs=1
autostart=true
autorestart=false                ;一次性任务, 不自动重启
startsecs=0
exitcodes=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stdout
stdout_logfile_maxbytes=0
